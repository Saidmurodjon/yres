name: CI

on:
  push:
    # The working branch is claude/**; `main` does not exist yet, so a main-only trigger meant CI never
    # ran on push. This only enables CI — deploy.yml deliberately keeps its own `main`-only filter.
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run type-check

      # Integration tests run on Miniflare's local D1 and apply packages/db/drizzle themselves
      # (apps/api/tests/helpers/test-db.ts) — no database service needed.
      - name: Test
        run: bun run test

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web

      - name: E2E test
        run: bunx playwright test
        working-directory: apps/web

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

      - name: Build
        run: bun run build
        env:
          # Placeholder — the build only needs *a* value to satisfy Vite's
          # env typing; the real API URL is baked in at deploy time by the
          # deploy workflow, not here.
          VITE_API_URL: https://example.invalid
