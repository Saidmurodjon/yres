name = "yres-api"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# wrangler dev defaults to port 8787, which doesn't match API_URL below (used
# as the OAuth redirect_uri registered with Google) — pin it to 3000 so the
# two stay in sync.
[dev]
port = 3000

[vars]
NODE_ENV = "development"
API_URL = "http://localhost:3000"
WEB_URL = "http://localhost:5173"
EMAIL_FROM = "YRES <onboarding@resend.dev>"

[[r2_buckets]]
binding = "REPORTS_BUCKET"
bucket_name = "yres-reports-dev"

# Chat attachments (docs/social-features.md) — separate from REPORTS_BUCKET
# since this holds user-uploaded content with different size/retention
# concerns. Never served publicly — routes/chat.ts proxies reads through
# the API so only conversation members can fetch a given attachment.
[[r2_buckets]]
binding = "CHAT_ATTACHMENTS_BUCKET"
bucket_name = "yres-chat-attachments-dev"

# Real-time notifications/chat (docs/social-features.md) — ConversationRoom
# is one DO instance per chat conversation (fan-out point for that
# conversation's WebSocket connections, Postgres stays the source of
# truth); UserNotificationChannel is one instance per user (pushes live
# bell updates). Both classes are exported from src/index.ts — Cloudflare
# binds `class_name` to whatever the Worker's entry module exports under
# that name, they aren't separate files it discovers on its own.
# `new_sqlite_classes` (vs. the older `new_classes`) uses the
# SQLite-backed storage backend, which is available on Cloudflare's Workers
# Free plan — confirm this is still the case for your account before
# deploying (see docs/calculation-engine-audit.md-style caveat in
# docs/social-features.md: this is genuinely new infra for the project,
# untested against a real Cloudflare account here).
[[durable_objects.bindings]]
name = "CONVERSATION_ROOM"
class_name = "ConversationRoom"

[[durable_objects.bindings]]
name = "USER_CHANNEL"
class_name = "UserNotificationChannel"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationRoom", "UserNotificationChannel"]

# Cloudflare's native Rate Limiting binding, used by src/middleware/rate-limit.ts
# to throttle sign-in/sign-up/password-reset requests at the edge. `limit`/
# `period` apply uniformly to every key the middleware passes it (it
# differentiates *who* is being limited, not *how much* — see that file's
# doc comment). Optional: if you don't provision this, the middleware falls
# back to an in-memory per-process limiter, which is fine for early/low-traffic
# deployments but isn't shared across Worker isolates.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Secrets (DATABASE_URL, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# BETTER_AUTH_SECRET, RESEND_API_KEY, SENTRY_DSN) are set via
# `wrangler secret put <NAME>` (add `--env production` for the production
# environment below) and are never stored in this file. See docs/deployment.md.

# --- Production environment ---
# `name`/`API_URL`/`WEB_URL` below are placeholders — replace with your
# actual Cloudflare Worker name and deployed URLs before going live.
[env.production]
name = "yres-api-production"
routes = [{ pattern = "yres-api.saidmurod.com", custom_domain = true }]

[env.production.vars]
NODE_ENV = "production"
API_URL = "https://yres-api.saidmurod.com"
WEB_URL = "https://yres.saidmurod.com"
EMAIL_FROM = "YRES <noreply@saidmurod.com>"

[[env.production.r2_buckets]]
binding = "REPORTS_BUCKET"
bucket_name = "yres-reports"

[[env.production.r2_buckets]]
binding = "CHAT_ATTACHMENTS_BUCKET"
bucket_name = "yres-chat-attachments"

[[env.production.durable_objects.bindings]]
name = "CONVERSATION_ROOM"
class_name = "ConversationRoom"

[[env.production.durable_objects.bindings]]
name = "USER_CHANNEL"
class_name = "UserNotificationChannel"

[[env.production.unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
